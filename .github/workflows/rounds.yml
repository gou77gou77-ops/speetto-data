name: rounds

# 회차 목록 + 상세 + 회차별 1등 배출점 → gh-pages의 rounds_latest.json
on:
  schedule:
    - cron: "0 0 * * *" # 09:00 KST
    - cron: "0 9 * * *" # 18:00 KST
  workflow_dispatch:

permissions:
  contents: write # gh-pages에 push

concurrency:
  group: publish-gh-pages # stores.yml과 같은 그룹: 동시에 push하지 않는다
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    # 저장소 Variable COLLECTOR_RUNNER에 self-hosted를 넣으면 내 PC 러너에서 돈다(docs/github-setup.md 10절)
    runs-on: ${{ vars.COLLECTOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40 # 약 73번 요청: 3초 간격 약 4분 + 시간 초과 재시도
    env:
      # 연락처는 Secret: 공개 로그에 *** 로만 보인다. Variable에 넣지 않는다
      COLLECTOR_CONTACT: ${{ secrets.COLLECTOR_CONTACT }}
      # 요청 간격(초). 비우면 GitHub 러너 3초, 내 PC 1초
      COLLECTOR_INTERVAL: ${{ vars.COLLECTOR_INTERVAL }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 공개 파일(gh-pages) 받기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: out

      # self-hosted(내 PC)에서는 PC에 설치된 Python을 쓴다
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      # 여기서 실패하면 아래 단계는 모두 건너뛰고, gh-pages의 기존 JSON은 그대로 남는다.
      - name: 동행복권 접속 확인
        run: python -u -m collector.check --target rounds

      - name: 회차·1등 배출점 수집
        env:
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          JUSO_COORD_API_KEY: ${{ secrets.JUSO_COORD_API_KEY }}
        run: python -u -m collector.rounds --stores out/stores.json --out out/rounds_latest.json

      - name: config.json 복사
        run: cp public/config.json out/config.json

      - name: gh-pages에 올리기
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rounds_latest.json config.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "rounds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin gh-pages
