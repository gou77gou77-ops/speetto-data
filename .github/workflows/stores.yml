name: stores

# 전국 판매점(스피또 판매점만) → gh-pages의 stores.json. 끝까지 다 받았을 때만 바꾼다
on:
  schedule:
    - cron: "0 18 * * 6" # 일요일 03:00 KST (토요일 18:00 UTC)
  workflow_dispatch:

permissions:
  contents: write # gh-pages에 push

concurrency:
  group: publish-gh-pages # rounds.yml과 같은 그룹: 동시에 push하지 않는다
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    # 저장소 Variable COLLECTOR_RUNNER에 self-hosted를 넣으면 내 PC 러너에서 돈다(docs/github-setup.md 10절)
    runs-on: ${{ vars.COLLECTOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120 # 약 1,448번 요청, 1초에 1건이면 약 25분
    env:
      COLLECTOR_CONTACT: ${{ vars.COLLECTOR_CONTACT }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 공개 파일(gh-pages) 받기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: out

      # self-hosted(내 PC)에서는 PC에 설치된 Python을 쓴다
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      # 여기서 실패하면 아래 단계는 모두 건너뛰고, gh-pages의 기존 JSON은 그대로 남는다.
      - name: 동행복권 접속 확인
        run: python -m collector.check --target stores

      - name: 전국 판매점 수집
        env:
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          JUSO_COORD_API_KEY: ${{ secrets.JUSO_COORD_API_KEY }}
        run: python -m collector.stores --out out/stores.json

      - name: config.json 복사
        run: cp public/config.json out/config.json

      - name: gh-pages에 올리기
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores.json config.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "stores $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin gh-pages
